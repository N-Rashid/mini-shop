<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=overlays-content">
  <meta name="theme-color" content="#e84393">
  <link rel="icon" type="image/png" href="/favicon.png" sizes="32x32">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <title>Админ — Контент сайта</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="admin-page">
  <header>
    <div class="container header-inner">
      <a href="/" class="logo"><span class="logo-icon">🍦</span> Мороженое Избербаш</a>
      <nav><span id="admin-name" class="user-info"></span></nav>
    </div>
  </header>

  <main class="container">
    <div class="admin-layout">
      <div id="sidebar"></div>
      <div class="admin-content">
        <h1>Контент сайта</h1>
        <div id="alert-area"></div>

        <section class="admin-section">
          <h2 class="admin-section-title">Главная страница</h2>
          <p style="color:var(--muted);margin-bottom:16px">Заголовок и текст под ним в верхней части каталога.</p>
          <form id="home-form">
            <div class="form-group">
              <label for="home-title">Заголовок</label>
              <input type="text" name="title" id="home-title" maxlength="120" required>
            </div>
            <div class="form-group">
              <label for="home-subtitle">Текст под заголовком</label>
              <textarea name="subtitle" id="home-subtitle" rows="4" maxlength="500" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Сохранить главную</button>
          </form>
        </section>

        <section class="admin-section">
          <h2 class="admin-section-title">Страница «О нас»</h2>
          <p style="color:var(--muted);margin-bottom:16px">Текст на странице «О нас» в верхнем меню сайта.</p>
          <form id="about-form">
            <div class="form-group">
              <label for="about-content">Текст о компании</label>
              <textarea name="content" id="about-content" rows="14" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Сохранить «О нас»</button>
          </form>
        </section>
      </div>
    </div>
  </main>

  <script src="/js/common.js"></script>
  <script src="/js/admin.js"></script>
  <script>
    (async () => {
      const admin = await requireAdmin();
      if (!admin) return;

      document.getElementById('admin-name').textContent = admin.name;
      document.getElementById('sidebar').innerHTML = adminSidebar('content');

      document.getElementById('admin-logout')?.addEventListener('click', (e) => {
        e.preventDefault();
        adminLogout();
      });

      const alertArea = document.getElementById('alert-area');
      const homeTitle = document.getElementById('home-title');
      const homeSubtitle = document.getElementById('home-subtitle');
      const aboutContent = document.getElementById('about-content');

      try {
        const [home, about] = await Promise.all([
          api('/api/admin/site/home'),
          api('/api/admin/site/about'),
        ]);
        homeTitle.value = home.title || '';
        homeSubtitle.value = home.subtitle || '';
        aboutContent.value = about.content || '';
      } catch (err) {
        showAlert(alertArea, err.message, 'error');
      }

      document.getElementById('home-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        try {
          await api('/api/admin/site/home', {
            method: 'PUT',
            body: JSON.stringify({
              title: homeTitle.value.trim(),
              subtitle: homeSubtitle.value.trim(),
            }),
          });
          showAlert(alertArea, 'Текст главной страницы сохранён', 'success');
        } catch (err) {
          showAlert(alertArea, err.message, 'error');
        }
      });

      document.getElementById('about-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const content = aboutContent.value.trim();
        try {
          await api('/api/admin/site/about', {
            method: 'PUT',
            body: JSON.stringify({ content }),
          });
          showAlert(alertArea, 'Текст «О нас» сохранён', 'success');
        } catch (err) {
          showAlert(alertArea, err.message, 'error');
        }
      });
    })();
  </script>
</body>
</html>
