<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=overlays-content">
  <meta name="theme-color" content="#e84393">
  <title>Админ — Клиент</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="admin-page">
  <header>
    <div class="container header-inner">
      <a href="/" class="logo"><span class="logo-icon">🍦</span> Мороженое Избербаш</a>
      <nav><span id="admin-name" class="user-info"></span></nav>
    </div>
  </header>

  <main class="container">
    <div class="admin-layout">
      <div id="sidebar"></div>
      <div class="admin-content">
        <a href="/admin/users.html" class="back-link">← К списку клиентов</a>
        <div id="user-header"></div>
        <div id="alert-area"></div>
        <h2 class="admin-section-title">История заказов</h2>
        <div id="user-orders"></div>
      </div>
    </div>
  </main>

  <div id="edit-user-modal" class="modal-overlay" style="display:none">
    <div class="modal">
      <h2>Редактировать клиента</h2>
      <form id="edit-user-form">
        <div class="form-group">
          <label for="edit-user-name">Имя *</label>
          <input id="edit-user-name" required>
        </div>
        <div class="form-group">
          <label for="edit-user-login">Логин *</label>
          <input id="edit-user-login" required>
        </div>
        <div class="form-group">
          <label for="edit-user-address">Адрес</label>
          <input id="edit-user-address">
        </div>
        <div class="form-group">
          <label for="edit-user-password">Новый пароль</label>
          <input id="edit-user-password" type="password" placeholder="Оставьте пустым, если не меняете">
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Сохранить</button>
          <button type="button" class="btn btn-outline" id="edit-user-cancel">Отмена</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/admin.js"></script>
  <script>
    let currentUser = null;

    function renderAdminOrderCard(o) {
      const badges = [
        `<span class="badge ${orderStatusClass(o.status)}">${escapeHtml(o.status_label || orderStatusLabel(o.status))}</span>`,
      ];
      if (o.deleted) badges.push('<span class="badge badge-deleted">Отменён</span>');
      if (o.is_archived) badges.push('<span class="badge badge-archived">Архив</span>');

      return `
        <article class="order-card ${o.deleted ? 'order-deleted' : ''}">
          <div class="order-header">
            <div>
              <strong>Заказ #${o.number ?? o.client_number ?? o.id}</strong>
              <p class="order-date">${formatDate(o.created_at)}</p>
            </div>
            <div class="order-badges">${badges.join(' ')}</div>
          </div>
          <p class="order-meta">Сумма: ${formatPrice(o.total)}</p>
          <ul class="order-items">
            ${(o.items || []).map(i => `
              <li>${escapeHtml(i.product_name)} — ${i.quantity} ${unitLabel(i.unit_type || 'pack')} × ${formatPrice(i.price)}</li>
            `).join('')}
          </ul>
        </article>`;
    }

    function renderUserProfile(user, orders) {
      const activeOrders = orders.filter(o => !o.deleted);
      const totalSpent = activeOrders.reduce((sum, o) => sum + (o.total || 0), 0);

      return `
        <section class="admin-user-profile">
          <div class="admin-user-profile-head">
            <div>
              <h1>${escapeHtml(user.name)}</h1>
              <p class="admin-user-meta">Логин: ${escapeHtml(user.login)} · ID ${user.id}</p>
            </div>
            <span class="badge ${user.deleted ? 'badge-deleted' : 'badge-active'}">
              ${user.deleted ? 'Удалён' : 'Активен'}
            </span>
          </div>
          <div class="admin-user-profile-grid">
            <div class="admin-user-profile-item">
              <span class="admin-user-profile-label">Адрес</span>
              <span>${escapeHtml(user.address || '—')}</span>
            </div>
            <div class="admin-user-profile-item">
              <span class="admin-user-profile-label">Заказов</span>
              <span>${orders.length}</span>
            </div>
            <div class="admin-user-profile-item">
              <span class="admin-user-profile-label">Сумма заказов</span>
              <span>${formatPrice(totalSpent)}</span>
            </div>
            ${user.deleted && user.deleted_at ? `
              <div class="admin-user-profile-item">
                <span class="admin-user-profile-label">Удалён</span>
                <span>${formatDate(user.deleted_at)}</span>
              </div>
            ` : ''}
          </div>
          <div class="admin-card-actions admin-card-actions-row">
            ${user.deleted ? `
              <button type="button" class="btn btn-primary btn-sm" id="restore-user-btn">Восстановить</button>
            ` : `
              <button type="button" class="btn btn-outline btn-sm" id="edit-user-btn">Изменить</button>
              <button type="button" class="btn btn-danger btn-sm" id="delete-user-btn">Удалить</button>
            `}
          </div>
        </section>`;
    }

    function openEditModal() {
      if (!currentUser) return;
      document.getElementById('edit-user-name').value = currentUser.name;
      document.getElementById('edit-user-login').value = currentUser.login;
      document.getElementById('edit-user-address').value = currentUser.address || '';
      document.getElementById('edit-user-password').value = '';
      document.getElementById('edit-user-modal').style.display = 'flex';
      lockPageScroll();
    }

    function closeEditModal() {
      document.getElementById('edit-user-modal').style.display = 'none';
      document.getElementById('edit-user-form').reset();
      unlockPageScroll();
    }

    async function loadUserProfile() {
      const headerEl = document.getElementById('user-header');
      const ordersEl = document.getElementById('user-orders');
      const alertArea = document.getElementById('alert-area');
      const userId = new URLSearchParams(location.search).get('id');

      try {
        const [user, orders] = await Promise.all([
          api(`/api/admin/users/${userId}`),
          api(`/api/admin/users/${userId}/orders`),
        ]);
        currentUser = user;
        document.title = `Админ — ${user.name}`;
        headerEl.innerHTML = renderUserProfile(user, orders);

        document.getElementById('edit-user-btn')?.addEventListener('click', openEditModal);
        document.getElementById('delete-user-btn')?.addEventListener('click', async () => {
          if (!confirm('Переместить клиента в удалённые? В течение недели его можно восстановить.')) return;
          await api(`/api/admin/users/${userId}`, { method: 'DELETE' });
          await loadUserProfile();
          showAlert(alertArea, 'Клиент перемещён в удалённые', 'success');
        });
        document.getElementById('restore-user-btn')?.addEventListener('click', async () => {
          try {
            await api(`/api/admin/users/${userId}/restore`, { method: 'POST' });
            await loadUserProfile();
            showAlert(alertArea, 'Клиент восстановлен', 'success');
          } catch (err) {
            showAlert(alertArea, err.message, 'error');
          }
        });

        if (!orders.length) {
          ordersEl.innerHTML = '<p style="color:var(--muted)">Заказов нет</p>';
          return;
        }
        ordersEl.innerHTML = orders.map(renderAdminOrderCard).join('');
      } catch (err) {
        headerEl.innerHTML = '<h1>Клиент</h1>';
        ordersEl.innerHTML = '';
        showAlert(alertArea, err.message, 'error');
      }
    }

    (async () => {
      const admin = await requireAdmin();
      if (!admin) return;

      const userId = new URLSearchParams(location.search).get('id');
      if (!userId) {
        location.href = '/admin/users.html';
        return;
      }

      document.getElementById('admin-name').textContent = admin.name;
      document.getElementById('sidebar').innerHTML = adminSidebar('users');

      document.getElementById('admin-logout')?.addEventListener('click', (e) => {
        e.preventDefault();
        adminLogout();
      });

      document.getElementById('edit-user-cancel').addEventListener('click', closeEditModal);
      document.getElementById('edit-user-modal').addEventListener('click', (e) => {
        if (e.target.id === 'edit-user-modal') closeEditModal();
      });

      document.getElementById('edit-user-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const alertArea = document.getElementById('alert-area');
        const payload = {
          name: document.getElementById('edit-user-name').value.trim(),
          login: document.getElementById('edit-user-login').value.trim(),
          address: document.getElementById('edit-user-address').value.trim(),
        };
        const password = document.getElementById('edit-user-password').value;
        if (password) payload.password = password;

        try {
          await api(`/api/admin/users/${userId}`, {
            method: 'PUT',
            body: JSON.stringify(payload),
          });
          showAlert(alertArea, 'Клиент обновлён', 'success');
          closeEditModal();
          await loadUserProfile();
        } catch (err) {
          showAlert(alertArea, err.message, 'error');
        }
      });

      await loadUserProfile();
    })();
  </script>
</body>
</html>
