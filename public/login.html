<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#e84393">
  <title>Вход — Мороженое Избербаш</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header data-site-header data-nav="login"></header>

  <main class="container">
    <div class="form-card">
      <h1>Вход для клиентов</h1>
      <div id="alert-area"></div>
      <form id="login-form">
        <div class="form-group">
          <label for="login">Логин</label>
          <input type="text" id="login" name="login" required autocomplete="username">
        </div>
        <div class="form-group">
          <label for="password">Пароль</label>
          <input type="password" id="password" name="password" required autocomplete="current-password">
        </div>
        <label class="form-check">
          <input type="checkbox" id="remember" name="remember">
          <span>Запомнить меня</span>
        </label>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Войти</button>
          <a href="/" class="btn btn-outline">Назад</a>
        </div>
      </form>
    </div>
  </main>

  <script src="/js/common.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alertArea = document.getElementById('alert-area');
      const login = document.getElementById('login').value;
      const password = document.getElementById('password').value;
      const remember = document.getElementById('remember').checked;

      try {
        await api('/api/auth/login', {
          method: 'POST',
          body: JSON.stringify({ login, password, remember }),
        });
        const next = new URLSearchParams(location.search).get('next') || '/account.html';
        location.href = next;
      } catch (err) {
        showAlert(alertArea, err.message, 'error');
      }
    });
  </script>
</body>
</html>
