<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#e84393">
  <link rel="icon" type="image/png" href="/favicon.png" sizes="32x32">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <title>Мороженое Избербаш — Каталог</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="page-home">
  <header data-site-header data-nav="catalog"></header>

  <main class="container">
    <section class="hero">
      <div class="hero-brand">
        <h1>
          <span class="hero-icon" aria-hidden="true">🍦</span>
          <span class="hero-title" id="hero-title">Мороженое Избербаш</span>
        </h1>
        <p class="hero-lead" id="hero-subtitle">Большой Ассортимент. Низкие Цены. Доставка. Мороженое для Кафе и Ресторанов</p>
        <p class="hero-phone"><a href="tel:+79034779706">+7 (903) 477-97-06</a></p>
      </div>
      <div class="search-bar">
        <input type="search" id="search-input" placeholder="Поиск по названию или описанию...">
      </div>
      <div id="category-quick-filters" class="category-quick-filters"></div>
      <div id="category-filters" class="category-filters category-filters--desktop"></div>
    </section>

    <div id="alert-area"></div>

    <div class="catalog-toolbar">
      <div class="catalog-toolbar-controls">
        <div class="catalog-category-dropdown" id="catalog-category-dropdown">
          <button type="button" class="catalog-filter-toggle" id="catalog-category-toggle" aria-expanded="false" aria-haspopup="true">
            <span class="catalog-category-toggle-icon" aria-hidden="true"></span>
            <span id="catalog-category-label">Все категории</span>
            <span class="catalog-filter-chevron" aria-hidden="true"></span>
          </button>
          <div class="catalog-filter-menu" id="catalog-category-menu" hidden></div>
        </div>
        <div class="catalog-filter-dropdown" id="catalog-filter-dropdown">
          <button type="button" class="catalog-filter-toggle" id="catalog-filter-toggle" aria-expanded="false" aria-haspopup="true">
            <span class="catalog-filter-toggle-icon" aria-hidden="true"></span>
            <span id="catalog-filter-label">Фильтр</span>
            <span class="catalog-filter-chevron" aria-hidden="true"></span>
          </button>
          <div class="catalog-filter-menu" id="catalog-filter-menu" hidden>
            <div class="catalog-filter-section">
              <p class="catalog-filter-section-title">Показать</p>
              <button type="button" class="catalog-filter-option active" data-tag="">Все товары</button>
              <button type="button" class="catalog-filter-option" data-tag="hit">Хит продаж</button>
              <button type="button" class="catalog-filter-option catalog-filter-option--desktop-only" data-tag="new">Новинки</button>
              <button type="button" class="catalog-filter-option catalog-filter-option--desktop-only" data-tag="sale">Акции</button>
            </div>
          <div class="catalog-filter-section">
            <p class="catalog-filter-section-title">Сортировка</p>
            <button type="button" class="catalog-filter-option active" data-sort="default">Как в каталоге</button>
            <button type="button" class="catalog-filter-option" data-sort="date_desc">Сначала новые</button>
            <button type="button" class="catalog-filter-option" data-sort="date_asc">Сначала старые</button>
          </div>
        </div>
        </div>
      </div>
    </div>

    <div id="products" class="products-grid">
      <p style="color:var(--muted);grid-column:1/-1;text-align:center">Загрузка...</p>
    </div>
    <div id="products-load-more" class="catalog-load-more-wrap" hidden></div>
  </main>

  <footer class="site-footer" data-site-footer data-show-brand="true"></footer>

  <div id="edit-modal" style="display:none"></div>

  <script src="/js/common.js"></script>
  <script src="/js/product-edit.js"></script>
  <script src="/js/main.js"></script>
</body>
</html>
